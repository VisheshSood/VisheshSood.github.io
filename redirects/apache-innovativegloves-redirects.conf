# Innovative Gloves website: canonical host + legacy redirects.
# Included from BOTH innovativegloves.net vhosts (:80 and :443).
# Every rule sends the visitor to the FINAL https://www.innovativegloves.net URL in ONE hop.
# Rules match the ORIGINAL request line (THE_REQUEST), so Apache's internal
# DirectoryIndex lookups (/ -> /index.html) can never trigger them, i.e. no loops.

RewriteEngine On
RewriteMap igLegacy "txt:/var/www/innovativegloves-site/redirects/legacy.map"

# 1) Obsolete fragments with no equivalent -> 410 Gone
RewriteCond %{THE_REQUEST} ^[A-Z]+\s([^?\s]+)
RewriteCond ${igLegacy:%1|NONE} ^GONE$
RewriteRule ^ - [G,L]

# 2) Legacy URL in the map -> 301 straight to its replacement on the canonical host
RewriteCond %{THE_REQUEST} ^[A-Z]+\s([^?\s]+)
RewriteCond ${igLegacy:%1|NONE} ^(/\S*)$
RewriteRule ^ https://www.innovativegloves.net%1 [R=301,L,NE]

# 3) Anything not on https://www -> 301 to the same path on https://www (Apache appends the query string itself)
RewriteCond %{HTTPS} !=on [OR]
RewriteCond %{HTTP_HOST} !^www\.innovativegloves\.net$ [NC]
RewriteCond %{THE_REQUEST} ^[A-Z]+\s([^?\s]+)
RewriteRule ^ https://www.innovativegloves.net%1 [R=301,L,NE]
